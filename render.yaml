services:
  - type: web
    name: team-sync-app
    runtime: node
    plan: free
    buildCommand: npm install --omit=optional && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: team_sync
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_EMPLOYEE_PASSWORD
        sync: false
